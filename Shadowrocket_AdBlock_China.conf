# GEOIP 分流
GEOIP,CN,DIRECT
FINAL,PROXY

[URL Rewrite]
# Anti-AD 增强广告拦截
# 订阅地址：https://anti-ad.net/surge2.txt
# 这里留空，实际使用时可直接在 Shadowrocket 添加订阅
^https?:\/\/.+\.ad\..+ - reject

[Host]
localhost = 127.0.0.1

[MITM]
skip-server-cert-verify = true
enable = true
hostname = *.baidu.com, *.qq.com, *.youku.com, *.iqiyi.com, *.bilibili.com, *.meituan.com, *.ele.me, *.ximalaya.com
