[General]
bypass-system = true
skip-proxy = 127.0.0.1, localhost
dns-server = system, 223.5.5.5, 119.29.29.29
ipv6 = false

# DNS 配置可根据需要调整
always-reject-url-rewrite = true
always-reject-udp = true
network-framework = true

[Rule]
# 国内常用服务直连
DOMAIN-SUFFIX,cn,DIRECT
DOMAIN-KEYWORD,baidu,DIRECT
DOMAIN-KEYWORD,qq,DIRECT
DOMAIN-KEYWORD,weixin,DIRECT
DOMAIN-KEYWORD,alipay,DIRECT
DOMAIN-KEYWORD,taobao,DIRECT
DOMAIN-KEYWORD,meituan,DIRECT
DOMAIN-KEYWORD,ele,DIRECT
DOMAIN-KEYWORD,ximalaya,DIRECT
DOMAIN-KEYWORD,163,DIRECT
DOMAIN-KEYWORD,netease,DIRECT

# 国外网站走代理
DOMAIN-SUFFIX,google.com,PROXY
DOMAIN-SUFFIX,youtube.com,PROXY
DOMAIN-SUFFIX,twitter.com,PROXY
DOMAIN-SUFFIX,github.com,PROXY
DOMAIN-SUFFIX,facebook.com,PROXY
DOMAIN-SUFFIX,instagram.com,PROXY
DOMAIN-SUFFIX,telegram.org,PROXY

# 常见广告域名拦截
DOMAIN-SUFFIX,adservice.google.com,REJECT
DOMAIN-SUFFIX,doubleclick.net,REJECT
DOMAIN-SUFFIX,googlesyndication.com,REJECT
DOMAIN-SUFFIX,googletagservices.com,REJECT
DOMAIN-SUFFIX,googletagmanager.com,REJECT
DOMAIN-SUFFIX,umeng.com,REJECT
DOMAIN-SUFFIX,umengcloud.com,REJECT
DOMAIN-SUFFIX,ads.union.jd.com,REJECT
DOMAIN-SUFFIX,ad.xiaomi.com,REJECT
DOMAIN-SUFFIX,ad.toutiao.com,REJECT
DOMAIN-SUFFIX,ad.sohu.com,REJECT
DOMAIN-SUFFIX,ad.youku.com,REJECT
DOMAIN-SUFFIX,ad.iqiyi.com,REJECT
DOMAIN-SUFFIX,afp.qiyi.com,REJECT
DOMAIN-SUFFIX,cm.bilibili.com,REJECT
DOMAIN-SUFFIX,track.bilibili.com,REJECT
DOMAIN-SUFFIX,adsmind.gdtimg.com,REJECT
DOMAIN-SUFFIX,gdt.qq.com,REJECT
DOMAIN-SUFFIX,midas.gtimg.cn,REJECT

# 视频广告
DOMAIN-KEYWORD,ad.iqiyi.com,REJECT
DOMAIN-KEYWORD,cm.bilibili.com,REJECT
DOMAIN-KEYWORD,ad.youku.com,REJECT
DOMAIN-KEYWORD,ad.tudou.com,REJECT
